services:
  - type: web
    name: returnwise-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: returnwise-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: APP_ENV
        value: production
      - key: SEED_DEMO_DATA
        value: "true"
      - key: LOGIN_EMAIL
        sync: false
      - key: LOGIN_PASSWORD_HASH
        sync: false
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"

databases:
  - name: returnwise-db
    plan: free
    region: singapore
    databaseName: returnwise
    user: returnwise
    ipAllowList: []
